<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Campus Bites</title>
<style>
:root{color-scheme:dark;--bg:#10100e;--panel:#1b1a17;--line:#39352b;--ink:#f7f1e4;--muted:#b3aa96;--gold:#f2c14e;--green:#4cd39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header{padding:18px;max-width:1060px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin-top:0}h1{color:var(--gold);margin:0}.tabs,.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);color:#17130a;font-weight:800;cursor:pointer}.tabs button{background:#302d25;color:var(--ink)}.tabs button.active{background:var(--gold);color:#17130a}.btn.secondary{border:1px solid var(--gold);background:transparent;color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}
.ai-widget{display:block!important;visibility:visible!important;max-width:1060px;margin:12px auto 18px;padding:0 16px}.ai-widget .panel{border:2px solid var(--gold);background:#211f18}.panel,.item,.suggestion,.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:var(--muted);font-size:.92rem}.ai-row{display:flex;gap:10px}.ai-row input{flex:1}.suggestions{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.suggestion{margin:0}.suggestion b{display:block}.suggestion .btn{width:100%;margin-top:8px}
main{max-width:1060px;margin:auto;padding:0 16px}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{margin:0}.row{justify-content:space-between}.price{font-weight:800}input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#111;color:var(--ink);font:inherit}.label{display:grid;gap:5px;margin:10px 0}.cartline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.status{color:var(--green)}.bill{border:1px dashed var(--gold);padding:16px;border-radius:12px;margin-top:12px}.bill table{width:100%;border-collapse:collapse}.bill td{padding:6px 0;border-bottom:1px solid var(--line)}.bill td:last-child{text-align:right}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stats strong{display:block;font-size:1.7rem;color:var(--gold)}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.column{border:1px solid var(--line);border-radius:12px;padding:10px}.ticket{margin:8px 0}@media(max-width:720px){header{flex-wrap:wrap}.grid,.stats,.board{grid-template-columns:1fr}.ai-row{flex-direction:column}.ai-row .btn{width:100%}}
</style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><nav class="tabs" aria-label="App sections"><button id="shopTab" class="active">Order</button><button id="ordersTab">My orders</button><button id="staffTab">Staff</button></nav></header>
<section class="ai-widget" aria-labelledby="ai-title"><div class="panel"><h2 id="ai-title">✨ AI food suggestions</h2><p class="muted">Tell us what you feel like eating and we’ll suggest available menu items.</p><div class="ai-row"><input id="want" aria-label="What do you feel like eating?" placeholder="Try: spicy snack, tea, or something light"><button class="btn" id="suggest">Get suggestions</button></div><div id="suggestions" class="suggestions" aria-live="polite"><p class="muted">Suggestions will appear here.</p></div></div></section>
<main id="app"><section class="panel">Loading menu…</section></main><footer style="max-width:1060px;margin:auto;padding:20px 16px;color:var(--muted)">Prices are shown in ₹.</footer>
<script>
'use strict';
const FALLBACK=[{id:'samosa',n:'Samosa',p:15,e:'🥟'},{id:'sandwich',n:'Veg sandwich',p:40,e:'🥪'},{id:'dosa',n:'Masala dosa',p:60,e:'🫓'},{id:'chai',n:'Masala chai',p:10,e:'🍵'},{id:'coffee',n:'Cold coffee',p:50,e:'🧋'},{id:'maggi',n:'Maggi',p:35,e:'🍜'},{id:'roll',n:'Paneer roll',p:70,e:'🌯'},{id:'fries',n:'French fries',p:45,e:'🍟'}];
const KEY='campus-bites-enhanced-v1',UPI='6398984451@upi',STATUS=['Placed','Preparing','Ready','Picked up'];let menu=FALLBACK,stock={},serverOrders=[],cart={},page='shop',lastBill=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
function local(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],next:101}}catch{return{orders:[],next:101}}}function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}function price(n){return '₹'+Number(n||0).toFixed(2)}function total(){return menu.reduce((sum,m)=>sum+(cart[m.id]||0)*m.p,0)}
async function boot(){try{const r=await fetch('/api/bootstrap',{cache:'no-store'});if(r.ok){const d=await r.json();menu=d.menu||FALLBACK;stock=d.stock||{};serverOrders=d.orders||[]}}catch{}render()}async function refresh(){try{const r=await fetch('/api/bootstrap',{cache:'no-store'});if(r.ok){const d=await r.json();stock=d.stock||{};serverOrders=d.orders||[]}}catch{};render()}function allOrders(){const demo=local().orders||[];return [...serverOrders,...demo].filter((o,i,a)=>a.findIndex(x=>String(x.id)===String(o.id))===i)}
function render(){const app=$('#app');['shopTab','ordersTab','staffTab'].forEach(id=>$(('#'+id)).classList.toggle('active',({'shopTab':'shop','ordersTab':'orders','staffTab':'staff'})[id]===page));if(page==='orders'){const o=local().orders||[];app.innerHTML=`<section class="panel"><h2>Your orders</h2>${o.length?o.map(x=>`<div class="cartline"><b>Order #${esc(x.id)}</b><b>${price(x.total)}</b></div>`).join(''):'<p class="muted">No orders saved in this browser yet.</p>'}</section>`;return}if(page==='staff'){renderStaff();return}const items=menu.map(m=>{const left=stock[m.id];const out=left===0;return `<article class="item"><div class="row"><h3>${esc(m.e||'🍽️')} ${esc(m.n)}</h3><span class="price">${price(m.p)}</span></div><p class="muted">${left===undefined?'Made fresh':out?'Sold out':left+' available'}</p><button class="btn" data-add="${esc(m.id)}" ${out?'disabled':''}>Add to order</button></article>`}).join('');const lines=menu.filter(m=>cart[m.id]).map(m=>`<div class="cartline"><span>${esc(m.n)} × ${cart[m.id]}</span><span>${price(m.p*cart[m.id])}</span></div>`).join('');app.innerHTML=`<div class="grid"><section><h2>Today's menu</h2><div class="menu">${items}</div></section><aside><section class="panel"><h2>Your order</h2>${lines||'<p class="muted">Your cart is empty.</p>'}<div class="row"><b>Bill total</b><b>${price(total())}</b></div><label class="label">Name<input id="customerName" autocomplete="name" placeholder="Your name"></label><button class="btn" id="checkout" ${total()<=0?'disabled':''}>Create bill & place order</button><div id="bill" class="${lastBill?'bill':'hidden'}">${lastBill?billHtml(lastBill):''}</div></section></aside></div>`}
function renderStaff(){const orders=allOrders(),active=orders.filter(o=>(o.status??0)<3).length,revenue=orders.reduce((s,o)=>s+Number(o.total||0),0);const cols=STATUS.map((name,s)=>`<div class="column"><h3>${name}</h3>${orders.filter(o=>(o.status??0)===s).map(o=>`<article class="ticket"><b>Order #${esc(o.id)} · ${esc(o.name||'Guest')}</b><p class="muted">${(o.items||[]).map(i=>`${esc(i.q)} × ${esc(i.n||i.id||'Item')}`).join(', ')}</p><p><b>${price(o.total)}</b></p>${s<3?`<button class="btn" data-advance="${esc(o.id)}">Advance</button>`:''}</article>`).join('')||'<p class="muted">No orders</p>'}</div>`).join('');const stockCards=menu.map(m=>`<article class="item"><div class="row"><h3>${esc(m.e)} ${esc(m.n)}</h3><b>${stock[m.id]===undefined?'—':stock[m.id]} left</b></div><button class="btn secondary" data-restock="${esc(m.id)}">Restock 10</button></article>`).join('');$('#app').innerHTML=`<section><div class="stats"><article class="panel"><span class="muted">Active orders</span><strong>${active}</strong></article><article class="panel"><span class="muted">Total orders</span><strong>${orders.length}</strong></article><article class="panel"><span class="muted">Revenue</span><strong>${price(revenue)}</strong></article></div><h2>Order board</h2><div class="board">${cols}</div><h2>Stock</h2><div class="menu">${stockCards}</div></section>`}
function rankSuggestions(text){const q=text.toLower(),g={spicy:['samosa','dosa','maggi','roll'],snack:['samosa','fries','sandwich'],drink:['chai','coffee'],tea:['chai'],coffee:['coffee'],cheap:['chai','samosa','sandwich'],light:['sandwich','chai'],veg:['dosa','sandwich','samosa'],sweet:['chai','coffee'],hungry:['dosa','roll','maggi']};let ids=[];Object.entries(g).forEach(([k,v])=>{if(q.includes(k))ids.push(...v)});if(!ids.length)ids=['samosa','chai','sandwich'];return [...new Set(ids)].map(id=>menu.find(m=>m.id===id)).filter(m=>m&&stock[m.id]!==0).slice(0,3)}async function suggest(){const text=$('#want').value.trim(),box=$('#suggestions');if(!text){box.innerHTML='<p class="muted">Type what you are craving first.</p>';return}box.innerHTML='<p class="muted">Finding tasty ideas…</p>';let picks=[];try{const r=await fetch('/api/ai/suggest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(r.ok){const d=await r.json();picks=(d.suggestions||d.items||[]).map(x=>menu.find(m=>m.id==(x.id||x.itemId||x))).filter(Boolean)}}catch{}if(!picks.length)picks=rankSuggestions(text);box.innerHTML=picks.length?picks.map(m=>`<article class="suggestion"><b>${esc(m.e||'🍽️')} ${esc(m.n)}</b><p class="muted">${price(m.p)}</p></article>`).join(''):'<p class="muted">No suggestions available.</p>'}
function billHtml(o){const pay=`upi://pay?pa=${encodeURIComponent(UPI)}&pn=${encodeURIComponent('Campus Bites')}&am=${Number(o.total).toFixed(2)}&cu=INR`;return `<h3>Bill · Order #${esc(o.id)}</h3><table>${o.items.map(i=>`<tr><td>${esc(i.q)} × ${esc(i.n)}</td><td>${price(i.q*i.p)}</td></tr>`).join('')}<tr><td><b>Total due</b></td><td><b>${price(o.total)}</b></td></tr></table><a class="btn" href="${pay}">Pay with UPI</a>`}async function checkout(){const name=$('#customerName').value.trim();if(!name){$('#customerName').focus();alert('Please enter your name.');return}const items=menu.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length)return;let order;try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,items,source:'web'})});if(r.ok)order=(await r.json()).order}catch{}if(!order){const db=local();order={id:db.next++,name,items:items.map(x=>{const m=menu.find(y=>y.id===x.id);return{id:m.id,n:m.n,p:m.p,q:x.q}}),total:total(),status:0};db.orders.unshift(order);saveLocal(db)}cart={};lastBill=order;render()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='shopTab'){page='shop';render()}else if(b.id==='ordersTab'){page='orders';render()}else if(b.id==='staffTab'){page='staff';refresh()}else if(b.id==='suggest')await suggest();else if(b.id==='checkout')await checkout();else if(b.dataset.add){const m=menu.find(x=>x.id===b.dataset.add);if(m&&(stock[m.id]===undefined||(cart[m.id]||0)<stock[m.id])){cart[m.id]=(cart[m.id]||0)+1;render()}}else if(b.dataset.advance){try{await fetch('/api/orders/'+b.dataset.advance+'/advance',{method:'PATCH'})}catch{}const demo=local(),o=demo.orders.find(x=>String(x.id)==b.dataset.advance);if(o&&(o.status??0)<3)o.status=(o.status??0)+1;saveLocal(demo);refresh()}else if(b.dataset.restock){try{await fetch('/api/inventory/'+b.dataset.restock+'/restock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:10})})}catch{}refresh()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='want')suggest()});boot();
</script>
</body>
</html>
