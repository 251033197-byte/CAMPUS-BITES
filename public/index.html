<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Bites</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--surface:#161616;--ink:#f5efe0;--mute:#a89f88;--line:#332d1c;--gold:#f2c14e;--ok:#4cd39a;--warn:#ffb84d;--bad:#ff7a7a}
    *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0}button,input,select{font:inherit}button{cursor:pointer}
    header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#000;color:var(--gold);border-bottom:2px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}header h1{font-size:clamp(1.15rem,4.5vw,1.6rem);flex:1}.tabs{display:flex;gap:4px;background:#332b16;padding:4px;border-radius:999px}.tabs button{border:0;background:none;color:inherit;padding:6px 14px;border-radius:999px;font-weight:700}.tabs button[aria-selected=true]{background:var(--gold);color:#000}
    main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:24px}.student{grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.item,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:0;background:var(--gold);color:#090909;font-weight:700;padding:9px 14px;border-radius:10px}.btn.alt{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}.btn.wa{background:#1fa855;color:#fff;text-decoration:none;text-align:center}.btn:disabled{opacity:.45;cursor:not-allowed}
    input,select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.badge{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid currentColor}.ok{color:var(--ok)}.low{color:var(--warn)}.out{color:var(--bad)}.note{color:var(--mute);font-size:.85rem}
    .steps{display:flex}.steps span{flex:1;text-align:center;font-size:.75rem;color:var(--mute);border-top:4px solid var(--line);padding-top:4px}.steps span.on{border-color:var(--ok);color:var(--ink);font-weight:700}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.col{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:10px;display:grid;gap:10px}.ticket{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:10px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats .panel{flex:1;min-width:140px}.stats strong{font-size:1.7rem}.qr{width:220px;max-width:100%;height:auto;border-radius:10px;background:#fff;padding:8px}.drawer{position:fixed;right:12px;top:70px;width:min(340px,92vw);max-height:60vh;overflow:auto}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20}[hidden]{display:none!important}
    @media(max-width:820px){.student{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}@media(max-width:520px){header{flex-wrap:wrap}.tabs{flex:1}.board{grid-template-columns:1fr}main{padding:14px}}
  </style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><div class="tabs" role="tablist"><button role="tab" id="t-s" aria-selected="true">Student</button><button role="tab" id="t-f" aria-selected="false">Staff</button><button role="tab" id="t-w" aria-selected="false">Bot</button></div><button class="bell" id="bell" aria-label="Notifications">🔔</button></header>
<div class="panel drawer" id="drawer" hidden><h3>Notifications</h3><div id="notes"></div></div>
<main id="app"><div class="panel">Loading Campus Bites…</div></main>
<div class="toast" id="toast" hidden></div>
<script>
const STATUS=["Placed","Preparing","Ready","Picked up"];
const CAFE_WA="916398984451";
const UPI_ID="6398984451@upi";
let M=[],stock={},orders=[],cart={},notes=[],view="s",me=null,chat=[{from:"bot",text:"Hi! 👋 Welcome to Campus Bites. Send 'menu' to begin."}],customer={name:"",gender:"",hostel:"",room:""};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),inr=n=>"₹"+Number(n||0).toFixed(2);
async function request(url,options={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...options});const d=await r.json().catch(()=>({error:"Unexpected server response"}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function load(){const d=await request("/api/bootstrap");M=d.menu||[];stock=d.stock||{};orders=d.orders||[]}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function notify(t){notes.unshift(t);toast(t);$("#notes").innerHTML=notes.map(n=>`<p class="note">• ${esc(n)}</p>`).join("")||'<p class="note">Nothing new yet.</p>'}
function badge(q){return q===0?' <span class="badge out">Sold out</span>':q<=5?` <span class="badge low">Only ${q} left</span>`:' <span class="badge ok">In stock</span>'}
function tracker(o){return `<div class="steps">${STATUS.map((s,i)=>`<span class="${i<=o.status?"on":""}">${s}</span>`).join("")}</div>`}
function receiptText(o){const text=`Campus Bites - Order Confirmation\n\nOrder #${o.id}\nCustomer: ${customer.name}\nGender: ${customer.gender}\nHostel: ${customer.hostel}\nRoom: ${customer.room}\n\nItems:\n${o.items.map(i=>`- ${i.q} x ${i.n} - ${inr(i.q*i.p)}`).join("\n")}\n\nTotal: ${inr(o.total)}\nPayment UPI: ${UPI_ID}\nStatus: ${STATUS[o.status]}`;return encodeURIComponent(text)}
function whatsappLink(o){return `https://wa.me/${CAFE_WA}?text=${receiptText(o)}`}
function student(){
 const lines=M.filter(m=>cart[m.id]).map(m=>({...m,q:cart[m.id]})),total=lines.reduce((s,l)=>s+l.q*l.p,0),mine=orders.find(o=>o.id===me);
 const upiUrl=`upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent("Campus Bites")}&am=${encodeURIComponent(total)}&cu=INR`;
 const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUrl)}`;
 return `<div class="student" style="display:grid"><section><h2 style="margin-bottom:12px">Today's menu</h2><div class="menu">${M.map(m=>{const q=stock[m.id]||0;return `<article class="item"><h3>${esc(m.e||"🍽️")} ${esc(m.n)}</h3><div class="row"><strong>${inr(m.p)}</strong>${badge(q)}</div><button class="btn" data-add="${esc(m.id)}" ${q-(cart[m.id]||0)<=0?"disabled":""}>Add</button></article>`}).join("")}</div></section>
 <aside style="display:grid;gap:14px"><div class="panel"><h2>Your details</h2><label>Name<input id="custName" value="${esc(customer.name)}" placeholder="Student name"></label><label>Gender<select id="custGender"><option value="">Select gender</option>${["Male","Female","Other","Prefer not to say"].map(x=>`<option${customer.gender===x?" selected":""}>${x}</option>`).join("")}</select></label><label>Hostel number<input id="custHostel" value="${esc(customer.hostel)}" placeholder="e.g. Hostel 3"></label><label>Room number<input id="custRoom" value="${esc(customer.room)}" placeholder="e.g. 214"></label></div>
 <div class="panel"><h2>Your order</h2>${lines.length?lines.map(l=>`<div class="row"><span>${esc(l.n)}</span><span class="qty"><button data-dec="${esc(l.id)}">−</button>${l.q}<button data-add="${esc(l.id)}" ${(stock[l.id]||0)<=l.q?"disabled":""}>+</button></span></div>`).join("")+'<div class="row"><strong>Total</strong><strong>'+inr(total)+'</strong></div><button class="btn" id="place">Place order</button><div style="text-align:center"><p class="note">Pay with UPI</p><img class="qr" src="'+qrUrl+'" alt="UPI QR code for '+UPI_ID+'"><p class="note"><strong>UPI ID:</strong> '+UPI_ID+'</p></div>':'<p class="note">Your cart is empty.</p>'}</div>
 ${mine?`<div class="panel"><h3>Order #${mine.id} · ${STATUS[mine.status]}</h3>${tracker(mine)}<a class="btn wa" href="${whatsappLink(mine)}" target="_blank" rel="noopener">Send receipt on WhatsApp</a></div>`:""}</aside></div>`
}
function staff(){const revenue=orders.reduce((s,o)=>s+(o.total||0),0);return `<div class="stats"><div class="panel"><span class="note">Active</span><strong>${orders.filter(o=>o.status<3).length}</strong></div><div class="panel"><span class="note">Orders</span><strong>${orders.length}</strong></div><div class="panel"><span class="note">Revenue</span><strong>${inr(revenue)}</strong></div></div><h2>Order board</h2><div class="board">${STATUS.map((s,i)=>`<section class="col"><h3>${s}</h3>${orders.filter(o=>o.status===i).map(o=>`<article class="ticket"><strong>#${o.id} ${esc(o.name)}</strong><div>${o.items.map(x=>`${x.q} × ${esc(x.n)}`).join(", ")}</div><div class="note">${esc(o.customer?.gender||"")} · ${esc(o.customer?.hostel||"")} · Room ${esc(o.customer?.room||"")}</div>${i<3?`<button class="btn" data-adv="${o.id}">Mark ${STATUS[i+1]}</button>`:`<button class="btn wa" data-wa="${o.id}">WhatsApp receipt</button>`}</article>`).join("")}</section>`).join("")}</div>`}
function bot(){return `<div style="max-width:500px;margin:auto"><div class="panel" style="padding:0"><div style="background:#075e54;padding:12px;font-weight:700">Campus Bites Bot</div><div id="chat" style="height:380px;overflow:auto;padding:12px;display:grid;gap:8px">${chat.map(m=>`<div style="justify-self:${m.from=== "me"?"end":"start"};max-width:85%;background:${m.from=== "me"?"#005c4b":"#202c33"};padding:9px 12px;border-radius:12px">${esc(m.text)}</div>`).join("")}</div><div class="row" style="padding:8px"><input id="bi" placeholder="Type menu or place an order"><button class="btn wa" id="bs">Send</button></div></div></div>`}
function render(){ $("#t-s").setAttribute("aria-selected",view=== "s");$("#t-f").setAttribute("aria-selected",view=== "f");$("#t-w").setAttribute("aria-selected",view=== "w");$("#app").innerHTML=view=== "s"?student():view=== "f"?staff():bot();const c=$("#chat");if(c)c.scrollTop=c.scrollHeight }
function saveCustomer(){customer.name=$("#custName")?.value.trim()||"";customer.gender=$("#custGender")?.value||"";customer.hostel=$("#custHostel")?.value.trim()||"";customer.room=$("#custRoom")?.value.trim()||""}
document.addEventListener("input",e=>{if(["custName","custHostel","custRoom"].includes(e.target.id)){saveCustomer()}});document.addEventListener("change",e=>{if(e.target.id=== "custGender")saveCustomer()});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;try{if(["t-s","t-f","t-w"].includes(t.id)){view=t.id.slice(2);render();return}if(t.id=== "bell"){$("#drawer").hidden=!$("#drawer").hidden;return}if(t.dataset.add){const id=t.dataset.add;if((cart[id]||0)<(stock[id]||0))cart[id]=(cart[id]||0)+1;render();return}if(t.dataset.dec){const id=t.dataset.dec;cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];render();return}if(t.id=== "place"){saveCustomer();if(!customer.name||!customer.gender||!customer.hostel||!customer.room){toast("Please fill name, gender, hostel and room number");return}const items=M.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length){toast("Add at least one item");return}const d=await request("/api/orders",{method:"POST",body:JSON.stringify({name:customer.name,items,source:"web",customer})});orders=d.orders||orders;stock=d.stock||stock;me=d.order.id;cart={};notify(`Order #${d.order.id} placed. Total ${inr(d.order.total)}.`);window.open(whatsappLink(d.order),"_blank","noopener");render();return}if(t.dataset.adv){const d=await request(`/api/orders/${t.dataset.adv}/advance`,{method:"PATCH"});orders=d.orders||orders;notify(`Order #${d.order.id} is ${STATUS[d.order.status]}`);render();return}if(t.dataset.wa){const o=orders.find(x=>x.id===+t.dataset.wa);if(o)window.open(whatsappLink(o),"_blank","noopener");return}if(t.id=== "bs"){const i=$("#bi"),text=i.value.trim();if(!text)return;chat.push({from:"me",text});chat.push({from:"bot",text:"Send your order from the Student tab for a complete receipt."});i.value="";render()}}catch(err){toast(err.message)}});
(async()=>{try{await load();render()}catch(err){$("#app").innerHTML=`<div class="panel"><h2>Backend connection required</h2><p>${esc(err.message)}</p></div>`}})();
</script>
</body>
</html>
