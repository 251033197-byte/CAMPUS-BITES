<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10100e"><title>Campus Bites</title>
<style>
:root{color-scheme:dark;--bg:#10100e;--panel:#1b1a17;--line:#39352b;--ink:#f7f1e4;--muted:#b3aa96;--gold:#f2c14e;--green:#4cd39a;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header{padding:18px max(18px,calc((100vw - 1060px)/2));background:#090908;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3,p{margin-top:0}h1{font-size:1.35rem;color:var(--gold);margin:0}main{max-width:1060px;margin:auto;padding:22px 16px}.tabs,.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);color:#17130a;font:inherit;font-weight:700;cursor:pointer}.tabs button{background:#302d25;color:var(--ink)}.tabs button.active{background:var(--gold);color:#17130a}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}.panel,.item,.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{margin:0}.row{justify-content:space-between}.muted{color:var(--muted);font-size:.92rem}.price{font-weight:800}.btn.secondary{border:1px solid var(--gold);background:transparent;color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#111;color:var(--ink);font:inherit}label{display:grid;gap:5px;margin:10px 0}.cartline{padding:8px 0;border-bottom:1px solid var(--line)}.notice{padding:12px;border-radius:10px;background:#272419}.bill{border:1px dashed var(--gold);padding:16px;border-radius:12px}.bill table{width:100%;border-collapse:collapse}.bill td{padding:6px 0;border-bottom:1px solid var(--line)}.bill td:last-child{text-align:right}.hidden{display:none!important}.status{color:var(--green)}.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}footer{max-width:1060px;margin:auto;padding:0 16px 30px;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}header{padding:14px}}
</style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><nav class="tabs"><button id="shopTab" class="active">Order</button><button id="ordersTab">My orders</button></nav></header>
<main id="app"><section class="panel">Loading menu…</section></main><footer>Prices are shown in ₹. Checkout prepares an itemized bill and payment request; payment is completed by you in your UPI app.</footer>
<script>
'use strict';
const FALLBACK=[{id:'samosa',n:'Samosa',p:15,e:'🥟'},{id:'sandwich',n:'Veg sandwich',p:40,e:'🥪'},{id:'dosa',n:'Masala dosa',p:60,e:'🫓'},{id:'chai',n:'Masala chai',p:10,e:'🍵'},{id:'coffee',n:'Cold coffee',p:50,e:'🧋'},{id:'maggi',n:'Maggi',p:35,e:'🍜'},{id:'roll',n:'Paneer roll',p:70,e:'🌯'},{id:'fries',n:'French fries',p:45,e:'🍟'}];
const KEY='campus-bites-enhanced-v1',UPI='6398984451@upi';let menu=FALLBACK,stock={},cart={},page='shop',lastBill=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function local(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],next:101}}catch{return{orders:[],next:101}}}function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error('Service returned '+r.status);return r.json()}
async function boot(){try{const d=await api('/api/bootstrap');menu=d.menu||FALLBACK;stock=d.stock||{}}catch{stock={};const old=local();old.orders=old.orders||[];saveLocal(old)}render()}
function price(n){return '₹'+Number(n||0).toFixed(2)}function total(){return menu.reduce((sum,m)=>sum+(cart[m.id]||0)*m.p,0)}
function render(){const app=$('#app');$('#shopTab').classList.toggle('active',page==='shop');$('#ordersTab').classList.toggle('active',page==='orders');if(page==='orders'){const o=local().orders;app.innerHTML=`<section class="panel"><h2>Your orders</h2>${o.length?o.map(x=>`<div class="cartline"><b>Order #${esc(x.id)}</b> · ${esc(x.createdAt||'')}<div class="muted">${x.items.map(i=>`${esc(i.q)} × ${esc(i.n)}`).join(', ')}</div><b>${price(x.total)}</b> · <span class="status">${esc(x.paymentStatus||'Payment pending')}</span></div>`).join(''):'<p class="muted">No orders saved in this browser yet.</p>'}</section>`;return}
const items=menu.map(m=>{const left=stock[m.id];return `<article class="item"><div class="row"><h3>${esc(m.e||'🍽️')} ${esc(m.n)}</h3><span class="price">${price(m.p)}</span></div><p class="muted">${left===undefined?'Made fresh at the café':left>0?`${left} available`: 'Availability confirmed at checkout'}</p><button class="btn" data-add="${esc(m.id)}" ${left===0?'disabled':''}>Add to order</button></article>`}).join('');
const lines=menu.filter(m=>cart[m.id]).map(m=>`<div class="row cartline"><span>${esc(m.n)} × ${cart[m.id]}</span><span>${price(m.p*cart[m.id])}<button class="btn secondary" data-remove="${esc(m.id)}" aria-label="Remove one ${esc(m.n)}">−</button></span></div>`).join('');
app.innerHTML=`<div class="grid"><section><div class="panel"><h2>Today's menu</h2><p class="muted">Tell us what you feel like and get quick suggestions.</p><div class="row"><input id="want" aria-label="What do you feel like eating?" placeholder="e.g. something spicy, snack under ₹50"/><button class="btn" id="suggest">Suggest</button></div><div id="suggestions" class="suggestions"></div></div><div class="menu">${items}</div></section><aside><section class="panel"><h2>Your order</h2>${lines||'<p class="muted">Your cart is empty. Add a menu item or try a suggestion.</p>'}<div class="row"><b>Bill total</b><b>${price(total())}</b></div><p class="muted">Automatically calculated from your selected items. No hidden tax or fees.</p><label>Name<input id="customerName" autocomplete="name" placeholder="Your name"></label><button class="btn" id="checkout" ${total()<=0?'disabled':''}>Create bill & place order</button><div id="bill" class="${lastBill?'':'hidden'}"></div></section></aside></div>`;
if(lastBill)showBill(lastBill)}
function rankSuggestions(text){const q=text.toLowerCase(),terms={spicy:['samosa','dosa','maggi','roll'],snack:['samosa','fries','sandwich'],drink:['chai','coffee'],tea:['chai'],coffee:['coffee'],cheap:['chai','samosa','sandwich'],light:['sandwich','chai'],veg:['dosa','sandwich','samosa'],hungry:['dosa','roll','sandwich'],sweet:['chai','coffee']};let ids=Object.entries(terms).filter(([k])=>q.includes(k)).flatMap(([,v])=>v);if(!ids.length)ids=['samosa','chai','sandwich'];return [...new Set(ids)].map(id=>menu.find(m=>m.id===id)).filter(m=>m&&stock[m.id]!==0).slice(0,3)}
async function suggest(){const text=$('#want').value.trim();if(!text){$('#want').focus();return}let picks,source='smart menu matches';try{const d=await api('/api/ai/suggest',{method:'POST',body:JSON.stringify({text})});const raw=d.suggestions||d.items||d.results||[];picks=raw.map(x=>menu.find(m=>m.id===(x.id||x.itemId))).filter(Boolean);if(picks.length)source='Campus Bites suggestions'}catch{}if(!picks?.length)picks=rankSuggestions(text);$('#suggestions').innerHTML=`<p class="muted" style="grid-column:1/-1">${source}</p>`+picks.map(m=>`<div class="suggestion"><b>${esc(m.e||'🍽️')} ${esc(m.n)}</b><p class="muted">${price(m.p)}</p><button class="btn" data-add="${esc(m.id)}">Add suggestion</button></div>`).join('')}
function showBill(order){const box=$('#bill');if(!box)return;const payment=`upi://pay?pa=${encodeURIComponent(UPI)}&pn=${encodeURIComponent('Campus Bites')}&am=${Number(order.total).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Campus Bites order '+order.id)}`;box.classList.remove('hidden');box.innerHTML=`<div class="bill"><h3>Bill · Order #${esc(order.id)}</h3><p class="status">Order placed · Payment pending</p><table>${order.items.map(i=>`<tr><td>${esc(i.q)} × ${esc(i.n)}</td><td>${price(i.q*i.p)}</td></tr>`).join('')}<tr><td><b>Total due</b></td><td><b>${price(order.total)}</b></td></tr></table><p class="muted">Review the amount and confirm payment yourself in your UPI app. Campus Bites does not charge your account automatically.</p><div class="actions"><a class="btn" href="${payment}">Pay ${price(order.total)} with UPI</a><button class="btn secondary" id="print">Print bill</button></div></div>`}
async function checkout(){const name=$('#customerName').value.trim();if(!name){$('#customerName').focus();alert('Please enter your name.');return}const items=menu.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length)return;let order;try{const d=await api('/api/orders',{method:'POST',body:JSON.stringify({name,items,source:'web'})});order=d.order}catch{const db=local();order={id:db.next++,name,items:items.map(x=>{const m=menu.find(y=>y.id===x.id);return{id:m.id,n:m.n,p:m.p,q:x.q}}),total:total(),createdAt:new Date().toLocaleString(),paymentStatus:'Payment pending'};db.orders.unshift(order);saveLocal(db)}if(!order.createdAt)order.createdAt=new Date().toLocaleString();order.paymentStatus='Payment pending';cart={};lastBill=order;render();showBill(order)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='shopTab'){page='shop';render()}else if(b.id==='ordersTab'){page='orders';render()}else if(b.id==='suggest')await suggest();else if(b.dataset.add){const m=menu.find(x=>x.id===b.dataset.add);if(m&&(stock[m.id]===undefined||(cart[m.id]||0)<stock[m.id]))cart[m.id]=(cart[m.id]||0)+1;render()}else if(b.dataset.remove){cart[b.dataset.remove]--;if(cart[b.dataset.remove]<=0)delete cart[b.dataset.remove];render()}else if(b.id==='checkout')await checkout();else if(b.id==='print')window.print()});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='want')suggest()});boot();
</script>
</body>
</html>
