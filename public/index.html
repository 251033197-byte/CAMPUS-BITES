<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Bites – Café ordering</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--surface:#161616;--ink:#f5efe0;--mute:#a89f88;--line:#332d1c;--brand:#d4af37;--brand-ink:#0a0a0a;--gold:#f2c14e;--ok:#4cd39a;--warn:#ffb84d;--bad:#ff7a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;letter-spacing:-.01em}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#000;color:var(--gold);border-bottom:2px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}header h1{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:800;flex:1;white-space:nowrap}.tabs{display:flex;gap:4px;background:rgba(242,193,78,.15);padding:4px;border-radius:999px}.tabs button{border:0;background:none;color:inherit;padding:6px 16px;border-radius:999px;font-weight:700}.tabs button[aria-selected=true]{background:var(--gold);color:#0a0a0a}.bell{position:relative;border:0;background:none;color:inherit;font-size:1.3rem;padding:4px 8px}.bell b{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font-size:.7rem;border-radius:999px;padding:0 6px}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:24px}.student{grid-template-columns:1fr 340px;align-items:start}@media(max-width:820px){.student{grid-template-columns:1fr}}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}.item .em{font-size:2rem}.item .p{font-weight:700}.badge{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;width:max-content;border:1px solid currentColor}.ok{color:var(--ok)}.low{color:var(--warn)}.out{color:var(--bad)}.btn{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:9px 14px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}.btn.wa{background:#1fa855;color:#fff;text-decoration:none;display:inline-block;text-align:center}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.steps{display:flex;gap:0;margin:6px 0}.steps span{flex:1;text-align:center;font-size:.78rem;color:var(--mute);border-top:4px solid var(--line);padding-top:4px}.steps span.on{border-color:var(--ok);color:var(--ink);font-weight:700}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}@media(max-width:520px){.board{grid-template-columns:1fr}}.col{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:10px;display:grid;gap:10px;align-content:start;min-height:120px}.ticket{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:10px;display:grid;gap:6px;font-size:.92rem}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats .panel{flex:1;min-width:140px}.stats strong{font-size:1.7rem;font-family:"Bricolage Grotesque",sans-serif}.drawer{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:min(340px,92vw);max-height:60vh;overflow:auto;z-index:9}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-weight:500;max-width:92vw}.note{color:var(--mute);font-size:.85rem}[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><div class="tabs" role="tablist"><button role="tab" id="t-s" aria-selected="true">Student</button><button role="tab" id="t-f" aria-selected="false">Staff</button><button role="tab" id="t-w" aria-selected="false">Bot</button></div><button class="bell" id="bell" aria-label="Notifications">🔔<b id="cnt" hidden>0</b></button></header>
<div class="panel drawer" id="drawer" hidden><h3>Notifications</h3><div id="notes"></div></div>
<main id="app"></main><div class="toast" id="toast" hidden></div>
<script>
const STATUS=["Placed","Preparing","Ready","Picked up"];
const CAFE_WA="919800000000";
let M=[],stock={},orders=[],chat=[{from:"bot",text:"Hi! 👋 I am the Campus Bites WhatsApp bot. Send menu to start, or tap a button below."}],view="s",cart={},notes=[],unread=0,me=null,aiText="",aiRes=null,aiBusy=false,aiSum="",sumBusy=false;
const $=s=>document.querySelector(s),inr=n=>"₹"+Number(n||0);
async function request(url,options={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...options});const d=await r.json().catch(()=>({error:"Unexpected server response"}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function loadData(){const d=await request("/api/bootstrap");M=d.menu;stock=d.stock;orders=d.orders}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function notify(t){notes.unshift(t);unread++;toast(t);bell()}function bell(){$("#cnt").hidden=!unread;$("#cnt").textContent=unread;$("#notes").innerHTML=notes.length?notes.map(n=>`<p class="note">• ${esc(n)}</p>`).join(""):'<p class="note">Nothing new yet.</p>'}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function badge(q){return q===0?'<span class="badge out">Sold out</span>':q<=5?`<span class="badge low">Only ${q} left</span>`:'<span class="badge ok">In stock</span>'}
function tracker(o){return `<div class="steps">${STATUS.map((s,i)=>`<span class="${i<=o.status?"on":""}">${s}</span>`).join("")}</div>`}
function waLink(o){const t=`Hi Campus Bites! Order #${o.id} for ${o.name}: `+o.items.map(i=>i.q+"× "+i.n).join(", ")+`. Total ${inr(o.total)}.`;return `https://wa.me/${CAFE_WA}?text=${encodeURIComponent(t)}`}
const mi=id=>M.find(m=>m.id===id);function demand(){const d={};orders.forEach(o=>o.items.forEach(i=>d[i.id]=(d[i.id]||0)+i.q));return d}
function aiPanel(){const r=aiRes;return `<div class="panel" style="margin-bottom:16px;border-color:var(--gold)"><h3>✨ Ask Campus Bites AI</h3><div class="row"><input id="ai" value="${esc(aiText)}" placeholder="e.g. 2 samosa and chai, or something spicy under ₹100" style="flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button class="btn" id="aiGo" ${aiBusy?"disabled":""}>${aiBusy?"Thinking…":"Suggest"}</button></div>${r?`<p>${esc(r.message)}</p>${r.items.length?`<p class="note">${r.items.map(i=>i.q+"× "+mi(i.id)?.n).join(", ")} · ${inr(r.total)}</p><button class="btn alt" id="aiAdd">Add all to cart</button>`:""}`:""}</div>`}
async function askAI(text){return request("/api/ai/suggest",{method:"POST",body:JSON.stringify({text})})}
function student(){const lines=M.filter(m=>cart[m.id]).map(m=>({...m,q:cart[m.id]})),total=lines.reduce((s,l)=>s+l.q*l.p,0),mine=orders.find(o=>o.id===me);return `<div class="student" style="display:grid"><section>${aiPanel()}<h2 style="margin-bottom:12px">Today’s menu</h2><div class="menu">${M.map(m=>{const q=stock[m.id]||0;return `<div class="item"><div class="em">${m.e}</div><h3>${m.n}</h3><div class="row"><span class="p">${inr(m.p)}</span>${badge(q)}</div><button class="btn" data-add="${m.id}" ${q-(cart[m.id]||0)<=0?"disabled":""}>Add to order</button></div>`}).join("")}</div></section><aside style="display:grid;gap:14px"><div class="panel"><h2>Your order</h2>${lines.length?lines.map(l=>`<div class="row"><span>${l.n}</span><span class="qty"><button data-dec="${l.id}" aria-label="Remove one ${l.n}">−</button>${l.q}<button data-add="${l.id}" aria-label="Add one ${l.n}">+</button></span></div>`).join("")+`<div class="row"><strong>Total</strong><strong>${inr(total)}</strong></div><input id="nm" placeholder="Your name" value="Guest" style="padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button class="btn" id="place">Place order</button>`:'<p class="note">Your cart is empty. Add something from the menu.</p>'}</div>${mine?`<div class="panel"><h3>Order #${mine.id} · ${STATUS[mine.status]}</h3>${tracker(mine)}<p class="note">${mine.status===2?"Ready at the counter. Show your order number.":"We’ll notify you when the status changes."}</p><a class="btn wa" href="${waLink(mine)}" target="_blank" rel="noopener">Send order on WhatsApp</a></div>`:""}</aside></div>`}
function staffAI(){const d=demand(),fl=M.filter(m=>(stock[m.id]||0)<=5||(d[m.id]||0)>=(stock[m.id]||0)).sort((a,b)=>(stock[a.id]||0)-(stock[b.id]||0)).slice(0,4),top=M.slice().sort((a,b)=>(d[b.id]||0)-(d[a.id]||0))[0];return `<div class="panel" style="border-color:var(--gold)"><h3>✨ AI insights</h3>${fl.length?fl.map(m=>`<div class="row"><span>${m.e} ${m.n}: ${stock[m.id]} left${d[m.id]?`, ${d[m.id]} ordered`:""}</span><strong>Restock ${Math.max(10,(d[m.id]||0)*2)}</strong></div>`).join(""):'<p class="note">Stock looks healthy.</p>'}${top&&d[top.id]?`<p class="note">Top seller so far: ${top.n} (${d[top.id]}).</p>`:""}<button class="btn alt" id="sumGo" ${sumBusy?"disabled":""}>${sumBusy?"Thinking…":"Generate sales summary"}</button>${aiSum?`<p>${esc(aiSum)}</p>`:""}</div>`}
function staff(){const by=s=>orders.filter(o=>o.status===s),active=orders.filter(o=>o.status<3).length,rev=orders.reduce((s,o)=>s+o.total,0);return `<div class="stats"><div class="panel"><span class="note">Active orders</span><strong>${active}</strong></div><div class="panel"><span class="note">Total orders</span><strong>${orders.length}</strong></div><div class="panel"><span class="note">Sales today</span><strong>${inr(rev)}</strong></div></div>${staffAI()}<div class="panel"><h3>2-3-4 Tree · Order ID search</h3><p class="note">Order IDs are indexed by the backend 2-3-4 tree.</p><div class="row"><input id="treeSearchId" type="number" placeholder="Enter order ID" style="flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button class="btn" id="treeSearchBtn">Search</button></div><p id="treeSearchResult" class="note"></p><p class="note">Sorted order IDs: ${orders.map(o=>o.id).sort((a,b)=>a-b).join(", ")||"No orders yet"}</p></div><h2>Order board</h2><div class="board">${STATUS.map((s,i)=>`<div class="col"><h3>${s} (${by(i).length})</h3>${by(i).map(o=>`<div class="ticket"><div class="row"><strong>#${o.id} ${esc(o.name)}</strong><span>${inr(o.total)}</span></div><div>${o.items.map(x=>x.q+"× "+esc(x.n)).join(", ")}</div>${i<3?`<button class="btn" data-adv="${o.id}">Mark ${STATUS[i+1].toLowerCase()}</button>`:""}</div>`).join("")||'<p class="note">No orders here.</p>'}</div>`).join("")}</div><h2>Stock</h2><div class="menu">${M.map(m=>`<div class="item"><div class="row"><strong>${m.e} ${m.n}</strong>${badge(stock[m.id]||0)}</div><div class="row"><span>${stock[m.id]||0} units</span><button class="btn alt" data-rs="${m.id}">Restock +10</button></div></div>`).join("")}</div>`}
function botReplyLocal(t){const l=t.toLowerCase().trim(),W={one:1,two:2,three:3,four:4},menuTxt="☕ Campus Bites menu\n"+M.map(m=>m.e+" "+m.n+" "+inr(m.p)+((stock[m.id]||0)?" ("+stock[m.id]+" left)":" (sold out)")).join("\n")+"\n\nOrder like: 2 samosa and 1 chai";if(/^(hi|hello|hey|menu|start)/.test(l))return "Hi! 👋 Welcome to Campus Bites.\n\n"+menuTxt;if(l.startsWith("help"))return "Send: menu, stock samosa, 2 samosa and 1 chai, or status";if(l.startsWith("stock")){const m=M.find(x=>l.includes(x.id));return m?m.e+" "+m.n+": "+((stock[m.id]||0)?stock[m.id]+" left":"sold out"):"Tell me the item, for example: stock samosa"}if(l.startsWith("status")){const o=[...orders].reverse().find(x=>x.source=== "bot");return o?"Order #"+o.id+" is: "+STATUS[o.status]+" ("+inr(o.total)+")":"You have no bot orders yet."}const items=[];M.forEach(m=>{if(l.includes(m.id)){const r=l.match(new RegExp("([0-9]+|one|two|three|four)[ x×]*(?:[a-z]+ )?"+m.id));items.push({id:m.id,q:r?(+r[1]||W[r[1]]||1):1})}});return items.length?null:"Sorry, I did not understand. Send menu or help."}
async function chatSend(text){chat.push({from:"me",text});let reply=botReplyLocal(text);if(reply===null){try{const o=await request("/api/orders",{method:"POST",body:JSON.stringify({name:"WhatsApp demo",source:"bot",items:M.filter(m=>text.toLowerCase().includes(m.id)).map(m=>{const mt=text.toLowerCase().match(new RegExp("(\\d+)\\s*"+m.id));return{id:m.id,q:mt?Number(mt[1]):1}})})});orders=o.orders;stock=o.stock;reply="✅ Order #"+o.order.id+" placed!\nTotal: "+inr(o.order.total)+"\nWe will update its status here."}catch(e){reply=e.message}}chat.push({from:"bot",text:reply});render()}
function botView(){const inp="flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)";return `<div style="max-width:460px;margin:0 auto;width:100%;display:grid;gap:10px"><div class="panel" style="padding:0;overflow:hidden;gap:0"><div style="background:#075e54;color:#fff;padding:10px 14px;font-weight:700">Campus Bites 🟢 <span style="font-weight:400;font-size:.8rem">WhatsApp bot demo</span></div><div id="chat" style="height:380px;overflow:auto;padding:12px;display:grid;gap:8px;align-content:start;background:#0b141a">${chat.map(m=>`<div style="justify-self:${m.from=== "me"?"end":"start"};max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;background:${m.from=== "me"?"#005c4b":"#202c33"};color:#e9edef">${esc(m.text)}</div>`).join("")}</div><div style="padding:8px;display:flex;gap:6px;flex-wrap:wrap">${["Menu","Stock samosa","2 samosa and 1 chai","Status"].map(c=>`<button class="btn alt" data-chip="${c}" style="padding:4px 10px;font-size:.85rem">${c}</button>`).join("")}</div><div class="row" style="padding:8px"><input id="bi" placeholder="Type a message" style="${inp}"><button class="btn wa" id="botSend">Send</button></div></div><p class="note">This is an in-app bot demonstration.</p></div>`}
function render(){$("#t-s").setAttribute("aria-selected",view=== "s");$("#t-f").setAttribute("aria-selected",view=== "f");$("#t-w").setAttribute("aria-selected",view=== "w");const y=scrollY;$("#app").innerHTML=view=== "s"?student():view=== "f"?staff():botView();scrollTo(0,y);const c=$("#chat");if(c)c.scrollTop=c.scrollHeight}
async function refresh(){const d=await request("/api/bootstrap");stock=d.stock;orders=d.orders}
document.addEventListener("input",e=>{if(e.target.id=== "ai")aiText=e.target.value});
document.addEventListener("keydown",e=>{if(e.key=== "Enter"&&e.target.id=== "ai")$("#aiGo")?.click();if(e.key=== "Enter"&&e.target.id=== "bi")$("#botSend")?.click()});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;try{if(["t-s","t-f","t-w"].includes(t.id)){view=t.id=== "t-s"?"s":t.id=== "t-f"?"f":"w";render();return}if(t.dataset.chip){await chatSend(t.dataset.chip);return}if(t.id=== "botSend"){const i=$("#bi");if(i.value.trim())await chatSend(i.value.trim());return}if(t.id=== "bell"){const d=$("#drawer");d.hidden=!d.hidden;unread=0;bell();return}if(t.id=== "aiGo"){aiText=$("#ai").value.trim();if(!aiText){toast("Type what you feel like eating");return}aiBusy=true;render();aiRes=await askAI(aiText);aiBusy=false;render();return}if(t.id=== "aiAdd"&&aiRes){aiRes.items.forEach(i=>cart[i.id]=Math.min((cart[i.id]||0)+i.q,stock[i.id]||0));toast("Added to your cart");render();return}if(t.id=== "sumGo"){sumBusy=true;render();const d=await request("/api/ai/summary");aiSum=d.summary;sumBusy=false;render();return}if(t.dataset.add){const id=t.dataset.add;if((cart[id]||0)<(stock[id]||0))cart[id]=(cart[id]||0)+1;else toast("No more "+id+" in stock");render();return}if(t.dataset.dec){const id=t.dataset.dec;if(--cart[id]<=0)delete cart[id];render();return}if(t.id=== "place"){const items=M.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length)return;const o=await request("/api/orders",{method:"POST",body:JSON.stringify({name:$("#nm").value.trim()||"Guest",items,source:"web"})});orders=o.orders;stock=o.stock;me=o.order.id;cart={};notify(`Order #${o.order.id} placed. Total ${inr(o.order.total)}.`);render();return}if(t.dataset.adv){const d=await request(`/api/orders/${t.dataset.adv}/advance`,{method:"PATCH"});orders=d.orders;stock=d.stock;const o=d.order;if(o.id===me)notify(`Order #${o.id} is now: ${STATUS[o.status]}.`);else toast(`Order #${o.id} → ${STATUS[o.status]}`);render();return}if(t.dataset.rs){const d=await request(`/api/inventory/${t.dataset.rs}/restock`,{method:"POST",body:JSON.stringify({quantity:10})});stock=d.stock;toast("Stock updated");render();return}if(t.id=== "treeSearchBtn"){const id=$("#treeSearchId").value,result=$("#treeSearchResult");if(!id){result.textContent="Enter an order ID.";return}const d=await request(`/api/orders/search/${id}`);result.textContent=d.order?`Found: #${d.order.id} · ${d.order.name} · ${STATUS[d.order.status]} · ${inr(d.order.total)}`:"Order ID not found.";return}}catch(err){aiBusy=false;sumBusy=false;toast(err.message||"Something went wrong");render()}});
(async()=>{try{await loadData();bell();render()}catch(e){$("#app").innerHTML=`<div class="panel"><h2>Could not connect to backend</h2><p>${esc(e.message)}</p><p>Start with <code>npm install</code> and <code>npm start</code>.</p></div>`}})();
</script>
</body>
</html>
