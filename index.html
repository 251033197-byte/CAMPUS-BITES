<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>Campus Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--panel:#161616;--ink:#f5efe0;--muted:#a89f88;--line:#332d1c;--gold:#f2c14e;--green:#4cd39a;--red:#ff7a7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#000;border-bottom:2px solid var(--gold);padding:12px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}header h1{color:var(--gold);font-size:1.35rem;flex:1}.tabs{display:flex;gap:4px;padding:4px;border-radius:30px;background:#302817}.tabs button{border:0;border-radius:24px;padding:7px 14px;background:transparent;color:var(--ink);font-weight:700}.tabs button[aria-selected=true]{background:var(--gold);color:#000}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:18px}.student{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.panel,.item,.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.panel,.item{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{display:inline-block;border:0;border-radius:10px;background:var(--gold);color:#111;padding:9px 14px;text-decoration:none;text-align:center;font-weight:700}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.green{background:#198754;color:white}.btn.secondary{border:1px solid var(--gold);background:transparent;color:var(--gold)}label{display:grid;gap:4px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:9px}.note{font-size:.88rem;color:var(--muted)}.badge{font-size:.78rem;border:1px solid currentColor;border-radius:30px;padding:2px 8px}.ok{color:var(--green)}.low{color:#ffb84d}.out{color:var(--red)}.qty{display:flex;align-items:center;gap:9px}.qty button{border:1px solid var(--line);border-radius:7px;background:#090909;color:var(--ink);width:30px;height:30px}.qr{width:210px;height:210px;max-width:100%;background:#fff;border-radius:8px;padding:6px}.steps{display:flex}.steps span{flex:1;text-align:center;font-size:.7rem;color:var(--muted);border-top:4px solid var(--line);padding-top:4px}.steps .on{color:var(--ink);border-color:var(--green)}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats .panel{flex:1;min-width:130px}.stats strong{font-size:1.5rem}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{display:grid;align-content:start;gap:10px;background:#0d0d0d;border:1px dashed var(--line);border-radius:12px;padding:10px}.ticket{border-left:4px solid var(--gold);display:grid;gap:8px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;max-width:90vw;background:var(--ink);color:#111;border-radius:30px;padding:10px 16px}.drawer{position:fixed;z-index:4;right:12px;top:70px;width:min(340px,90vw);max-height:60vh;overflow:auto}[hidden]{display:none!important}.mode{font-size:.78rem;color:var(--muted)}@media(max-width:800px){.student{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:14px}.board{grid-template-columns:1fr}header{padding:12px}.tabs{width:100%;justify-content:space-between}.tabs button{flex:1}}
</style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><nav class="tabs" role="tablist" aria-label="App sections"><button id="t-s" role="tab" aria-selected="true">Student</button><button id="t-f" role="tab" aria-selected="false">Staff</button><button id="t-w" role="tab" aria-selected="false">Info</button></nav><button id="bell" class="btn secondary" aria-label="Notifications">🔔</button></header>
<div class="panel drawer" id="drawer" hidden><h3>Notifications</h3><div id="notes"><p class="note">Nothing new yet.</p></div></div><main id="app"><section class="panel">Loading Campus Bites…</section></main><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const STATUS=['Placed','Preparing','Ready','Picked up'],CAFE_WA='916398984451',UPI_ID='6398984451@upi',STORAGE_KEY='campus-bites-demo-v1';
const MENU=[{id:'samosa',n:'Samosa',p:15,e:'🥟'},{id:'sandwich',n:'Veg sandwich',p:40,e:'🥪'},{id:'dosa',n:'Masala dosa',p:60,e:'🫓'},{id:'chai',n:'Masala chai',p:10,e:'🍵'},{id:'coffee',n:'Cold coffee',p:50,e:'🧋'},{id:'maggi',n:'Maggi',p:35,e:'🍜'},{id:'roll',n:'Paneer roll',p:70,e:'🌯'},{id:'fries',n:'French fries',p:45,e:'🍟'}],INITIAL_STOCK={samosa:20,sandwich:8,dosa:12,chai:50,coffee:3,maggi:0,roll:9,fries:15};
let M=[],stock={},orders=[],cart={},notes=[],view='s',me=null,localMode=false,chat=[],customer={name:'',gender:'',hostel:'',room:''};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n||0).toFixed(2);
function readLocal(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.stock&&Array.isArray(x.orders))return x}catch{}return{stock:{...INITIAL_STOCK},orders:[],nextOrderId:101}}
function writeLocal(x){localStorage.setItem(STORAGE_KEY,JSON.stringify(x))}
function localRequest(url,options={}){localMode=true;const u=new URL(url,location.href),path=u.pathname,method=(options.method||'GET').toUpperCase(),db=readLocal();if(path==='/api/bootstrap')return{menu:MENU,stock:db.stock,orders:db.orders};if(path==='/api/menu')return{menu:MENU};if(path==='/api/inventory')return{stock:db.stock};if(path==='/api/orders'&&method==='GET')return{orders:db.orders};if(path==='/api/orders'&&method==='POST'){let body={};try{body=JSON.parse(options.body||'{}')}catch{}if(!Array.isArray(body.items)||!body.items.length)throw Error('Add at least one item');const items=[];for(const line of body.items){const m=MENU.find(x=>x.id===line.id),q=Number(line.q);if(!m||!Number.isInteger(q)||q<1)throw Error('Invalid menu item or quantity');if((db.stock[m.id]||0)<q)throw Error(m.n+' is out of stock');items.push({id:m.id,n:m.n,p:m.p,q})}items.forEach(x=>db.stock[x.id]-=x.q);const order={id:db.nextOrderId++,name:String(body.name||'Guest').trim()||'Guest',customer:body.customer||{},items,total:items.reduce((s,x)=>s+x.q*x.p,0),status:0,source:body.source||'web',createdAt:new Date().toISOString()};db.orders.unshift(order);writeLocal(db);return{order,orders:db.orders,stock:db.stock}}const adv=path.match(/^\/api\/orders\/(\d+)\/advance$/);if(adv&&method==='PATCH'){const order=db.orders.find(x=>x.id===Number(adv[1]));if(!order)throw Error('Order not found');if(order.status<3)order.status++;writeLocal(db);return{order,orders:db.orders,stock:db.stock}}if(path==='/api/health')return{ok:true,mode:'browser-local'};throw Error('This API action is unavailable in browser demo mode')}
async function request(url,options={}){try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error('API returned '+r.status);return await r.json()}catch(error){return localRequest(url,options)}}
async function load(){const d=await request('/api/bootstrap');M=d.menu||MENU;stock=d.stock||{...INITIAL_STOCK};orders=d.orders||[]}
function toast(s){const e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.hidden=true,2800)}function notify(s){notes.unshift(s);$('#notes').innerHTML=notes.map(x=>`<p class="note">• ${esc(x)}</p>`).join('')}
function badge(q){return q===0?'<span class="badge out">Sold out</span>':q<=5?`<span class="badge low">Only ${q} left</span>`:'<span class="badge ok">In stock</span>'}function tracker(o){return`<div class="steps">${STATUS.map((s,i)=>`<span class="${i<=o.status?'on':''}">${s}</span>`).join('')}</div>`}
function receiptLink(o){const c=o.customer||customer,text=`Campus Bites order #${o.id}\nName: ${o.name}\nGender: ${c.gender||'—'}\nHostel: ${c.hostel||'—'}\nRoom: ${c.room||'—'}\n\n${o.items.map(x=>`${x.q} x ${x.n}: ${inr(x.q*x.p)}`).join('\n')}\n\nTotal: ${inr(o.total)}\nUPI: ${UPI_ID}\nStatus: ${STATUS[o.status]}`;return`https://wa.me/${CAFE_WA}?text=${encodeURIComponent(text)}`}
function student(){const lines=M.filter(m=>cart[m.id]).map(m=>({...m,q:cart[m.id]})),total=lines.reduce((s,x)=>s+x.q*x.p,0),mine=orders.find(o=>o.id===me),upi=`upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent('Campus Bites')}&am=${total.toFixed(2)}&cu=INR`,qr=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upi)}`;return`<div class="student"><section><h2 style="margin-bottom:12px">Today's menu</h2><p class="mode">${localMode?'Demo mode: orders are saved in this browser.':'Connected to Campus Bites API.'}</p><div class="menu">${M.map(m=>{const q=stock[m.id]||0;return`<article class="item"><h3>${esc(m.e)} ${esc(m.n)}</h3><div class="row"><strong>${inr(m.p)}</strong>${badge(q)}</div><button class="btn" data-add="${esc(m.id)}" ${q-(cart[m.id]||0)<=0?'disabled':''}>Add to order</button></article>`}).join('')}</div></section><aside style="display:grid;gap:14px"><section class="panel"><h2>Your details</h2><label>Name<input id="custName" value="${esc(customer.name)}" placeholder="Student name" autocomplete="name"></label><label>Gender<select id="custGender"><option value="">Select gender</option>${['Male','Female','Other','Prefer not to say'].map(x=>`<option${customer.gender===x?' selected':''}>${x}</option>`).join('')}</select></label><label>Hostel number<input id="custHostel" value="${esc(customer.hostel)}" placeholder="e.g. Hostel 3"></label><label>Room number<input id="custRoom" value="${esc(customer.room)}" placeholder="e.g. 214"></label></section><section class="panel"><h2>Your order</h2>${lines.length?lines.map(x=>`<div class="row"><span>${esc(x.n)}</span><span class="qty"><button aria-label="Remove one ${esc(x.n)}" data-dec="${x.id}">−</button>${x.q}<button aria-label="Add one ${esc(x.n)}" data-add="${x.id}" ${(stock[x.id]||0)<=x.q?'disabled':''}>+</button></span></div>`).join('')+`<div class="row"><strong>Total</strong><strong>${inr(total)}</strong></div><button class="btn" id="place">Place order</button><div style="text-align:center"><p class="note">Scan to pay with UPI</p><img class="qr" src="${qr}" alt="UPI payment QR for ${UPI_ID}"><p class="note">UPI ID: <strong>${UPI_ID}</strong></p></div>`:'<p class="note">Your cart is empty. Add an item to see checkout and payment options.</p>'}</section>${mine?`<section class="panel"><h3>Order #${mine.id} · ${STATUS[mine.status]}</h3>${tracker(mine)}<a class="btn green" href="${receiptLink(mine)}" target="_blank" rel="noopener">Open WhatsApp receipt</a></section>`:''}</aside></div>`}
function staff(){const rev=orders.reduce((s,o)=>s+Number(o.total||0),0);return`<div class="stats"><section class="panel"><span class="note">Active orders</span><strong>${orders.filter(o=>o.status<3).length}</strong></section><section class="panel"><span class="note">All orders</span><strong>${orders.length}</strong></section><section class="panel"><span class="note">Order total</span><strong>${inr(rev)}</strong></section></div><h2>Order board</h2><p class="note">${localMode?'Demo data is stored in this browser only.':'Live backend orders.'}</p><div class="board">${STATUS.map((s,i)=>`<section class="col"><h3>${s}</h3>${orders.filter(o=>o.status===i).map(o=>`<article class="ticket"><strong>#${o.id} ${esc(o.name)}</strong><div>${o.items.map(x=>`${x.q} × ${esc(x.n)}`).join(', ')}</div><div class="note">${esc(o.customer?.gender||'')} · ${esc(o.customer?.hostel||'')} · Room ${esc(o.customer?.room||'')}</div>${i<3?`<button class="btn" data-adv="${o.id}">Mark ${STATUS[i+1]}</button>`:`<a class="btn green" href="${receiptLink(o)}" target="_blank" rel="noopener">WhatsApp receipt</a>`}</article>`).join('')||'<span class="note">No orders</span>'}</section>`).join('')}</div>`}
function info(){return`<section class="panel"><h2>Campus Bites</h2><p>Browse the menu, add items, enter your pickup details, and place an order. Use the Staff tab to track orders.</p><h3>Payment and receipts</h3><p>Checkout shows a UPI QR code and UPI ID. WhatsApp opens a prefilled receipt; you must review and send it in WhatsApp.</p><h3>Running the project</h3><p>On GitHub Pages this runs in browser demo mode. Demo orders are saved only in this browser. For shared/live orders, run the Node/Express server using <code>npm install</code> and <code>npm start</code>.</p></section>`}
function render(){for(const id of ['s','f','w'])$('#t-'+id).setAttribute('aria-selected',view===id);$('#app').innerHTML=view==='s'?student():view==='f'?staff():info()}
function saveCustomer(){customer={name:$('#custName')?.value.trim()||'',gender:$('#custGender')?.value||'',hostel:$('#custHostel')?.value.trim()||'',room:$('#custRoom')?.value.trim()||''}}
document.addEventListener('input',e=>{if(['custName','custHostel','custRoom'].includes(e.target.id))saveCustomer()});document.addEventListener('change',e=>{if(e.target.id==='custGender')saveCustomer()});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.id==='t-s'||b.id==='t-f'||b.id==='t-w'){view=b.id.slice(2);render();return}if(b.id==='bell'){$('#drawer').hidden=!$('#drawer').hidden;return}if(b.dataset.add){const id=b.dataset.add;if((cart[id]||0)<(stock[id]||0))cart[id]=(cart[id]||0)+1;render();return}if(b.dataset.dec){const id=b.dataset.dec;cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];render();return}if(b.id==='place'){saveCustomer();if(!customer.name||!customer.gender||!customer.hostel||!customer.room){toast('Please complete all student details.');return}const items=M.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length){toast('Add at least one item.');return}const d=await request('/api/orders',{method:'POST',body:JSON.stringify({name:customer.name,items,source:'web',customer})});orders=d.orders||orders;stock=d.stock||stock;me=d.order.id;cart={};notify(`Order #${d.order.id} placed — ${inr(d.order.total)}.`);render();window.open(receiptLink(d.order),'_blank','noopener');return}if(b.dataset.adv){const d=await request(`/api/orders/${b.dataset.adv}/advance`,{method:'PATCH'});orders=d.orders||orders;notify(`Order #${d.order.id} is ${STATUS[d.order.status]}.`);render()}}catch(err){toast(err.message||'Something went wrong.')}});
(async()=>{try{await load();render()}catch(err){$('#app').innerHTML=`<section class="panel"><h2>Could not start</h2><p>${esc(err.message)}</p><p>Reload the page to try again.</p></section>`}})();
</script></body></html>
