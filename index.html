<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Bites</title>
<style>
:root{color-scheme:dark;--bg:#10100e;--panel:#1b1a17;--line:#39352b;--ink:#f7f1e4;--muted:#b3aa96;--gold:#f2c14e;--green:#4cd39a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header{padding:18px;max-width:1060px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin-top:0}h1{color:var(--gold);margin-bottom:0}.tabs,.row,.actions{display:flex;align-items:center;gap:10px}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);color:#17130a;font-weight:800;cursor:pointer}.tabs button{background:#302d25;color:var(--ink)}.tabs button.active{background:var(--gold);color:#17130a}.btn.secondary{border:1px solid var(--gold);background:transparent;color:var(--gold)}
.ai-widget{display:block!important;position:relative!important;z-index:50!important;visibility:visible!important;max-width:1060px;margin:12px auto 18px;padding:0 16px}.ai-widget .panel{display:block!important;visibility:visible!important;opacity:1!important;border:2px solid var(--gold);background:#211f18;box-shadow:0 10px 30px #0008}.panel,.item,.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:var(--muted);font-size:.92rem}.ai-row{display:flex;gap:10px}.ai-row input{flex:1}input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;background:#111;color:var(--ink);font:inherit}.suggestions{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.suggestion{margin:0}.suggestion b{display:block}.suggestion .btn{width:100%;margin-top:8px}
main{max-width:1060px;margin:auto;padding:0 16px}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{margin:0}.row{justify-content:space-between}.price{font-weight:800}.cartline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.bill{border:1px dashed var(--gold);padding:16px;border-radius:12px;margin-top:12px}.bill table{width:100%;border-collapse:collapse}.bill td{padding:6px 0;border-bottom:1px solid var(--line)}.bill td:last-child{text-align:right}.label{display:grid;gap:5px;margin:10px 0}footer{max-width:1060px;margin:auto;padding:0 16px 30px;color:var(--muted)}
@media(max-width:720px){header{flex-wrap:wrap}.grid{grid-template-columns:1fr}.ai-row{flex-direction:column}.ai-row .btn{width:100%}}
</style>
</head>
<body>
<header><h1>Campus Bites ☕</h1><nav class="tabs"><button id="shopTab" class="active">Order</button><button id="ordersTab">My orders</button></nav></header>
<section class="ai-widget" aria-labelledby="ai-title"><div class="panel"><h2 id="ai-title">✨ AI food suggestions</h2><p class="muted">Tell us what you feel like eating and we’ll suggest available menu items.</p><div class="ai-row"><input id="want" aria-label="What do you feel like eating?" placeholder="Try: spicy snack, tea, or something light"><button class="btn" id="suggest">Get suggestions</button></div><div id="suggestions" class="suggestions" aria-live="polite"><p class="muted">Suggestions will appear here.</p></div></div></section>
<main id="app"><section class="panel">Loading menu…</section></main>
<footer>Prices are shown in ₹. Checkout prepares an itemized bill and UPI payment request.</footer>
<script>
'use strict';
const FALLBACK=[{id:'samosa',n:'Samosa',p:15,e:'🥟'},{id:'sandwich',n:'Veg sandwich',p:40,e:'🥪'},{id:'dosa',n:'Masala dosa',p:60,e:'🫓'},{id:'chai',n:'Masala chai',p:10,e:'🍵'},{id:'coffee',n:'Cold coffee',p:50,e:'🧋'},{id:'maggi',n:'Maggi',p:35,e:'🍜'},{id:'roll',n:'Paneer roll',p:70,e:'🌯'},{id:'fries',n:'French fries',p:45,e:'🍟'}];
const KEY='campus-bites-enhanced-v1',UPI='6398984451@upi';let menu=FALLBACK,stock={},cart={},page='shop',lastBill=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function local(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],next:101}}catch{return{orders:[],next:101}}}function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}
function price(n){return '₹'+Number(n||0).toFixed(2)}function total(){return menu.reduce((sum,m)=>sum+(cart[m.id]||0)*m.p,0)}
async function boot(){try{const r=await fetch('/api/bootstrap');if(r.ok){const d=await r.json();menu=d.menu||FALLBACK;stock=d.stock||{}}}catch{}render()}
function render(){const app=$('#app');$('#shopTab').classList.toggle('active',page==='shop');$('#ordersTab').classList.toggle('active',page==='orders');if(page==='orders'){const orders=local().orders||[];app.innerHTML=`<section class="panel"><h2>Your orders</h2>${orders.length?orders.map(o=>`<div class="cartline"><b>Order #${esc(o.id)}</b><b>${price(o.total)}</b></div>`).join(''):'<p class="muted">No orders saved in this browser yet.</p>'}</section>`;return}
const items=menu.map(m=>{const left=stock[m.id];const out=left===0;return `<article class="item"><div class="row"><h3>${esc(m.e||'🍽️')} ${esc(m.n)}</h3><span class="price">${price(m.p)}</span></div><p class="muted">${left===undefined?'Made fresh at the café':out?'Currently sold out':left+' available'}</p><button class="btn" data-add="${esc(m.id)}" ${out?'disabled':''}>Add to order</button></article>`}).join('');
const lines=menu.filter(m=>cart[m.id]).map(m=>`<div class="cartline"><span>${esc(m.n)} × ${cart[m.id]}</span><span>${price(m.p*cart[m.id])}</span></div>`).join('');
app.innerHTML=`<div class="grid"><section><h2>Today's menu</h2><div class="menu">${items}</div></section><aside><section class="panel"><h2>Your order</h2>${lines||'<p class="muted">Your cart is empty. Add a menu item or try a suggestion above.</p>'}<div class="row"><b>Bill total</b><b>${price(total())}</b></div><label class="label">Name<input id="customerName" autocomplete="name" placeholder="Your name"></label><button class="btn" id="checkout" ${total()<=0?'disabled':''}>Create bill & place order</button><div id="bill" class="${lastBill?'bill':'hidden'}">${lastBill?billHtml(lastBill):''}</div></section></aside></div>`}
function rankSuggestions(text){const q=text.toLowerCase(),groups={spicy:['samosa','dosa','maggi','roll'],snack:['samosa','fries','sandwich'],drink:['chai','coffee'],tea:['chai'],coffee:['coffee'],cheap:['chai','samosa','sandwich'],light:['sandwich','chai'],veg:['dosa','sandwich','samosa'],sweet:['chai','coffee'],hungry:['dosa','roll','maggi']};let ids=[];Object.entries(groups).forEach(([k,v])=>{if(q.includes(k))ids.push(...v)});if(!ids.length)ids=['samosa','chai','sandwich'];return [...new Set(ids)].map(id=>menu.find(m=>m.id===id)).filter(m=>m&&(stock[m.id]!==0)).slice(0,3)}
async function suggest(){const text=$('#want').value.trim(),box=$('#suggestions');if(!text){box.innerHTML='<p class="muted">Type what you are craving first.</p>';$('#want').focus();return}box.innerHTML='<p class="muted">Finding tasty ideas…</p>';let picks=[];try{const r=await fetch('/api/ai/suggest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(r.ok){const d=await r.json();const ids=d.suggestions||d.items||[];picks=ids.map(x=>menu.find(m=>m.id==(x.id||x.itemId||x))).filter(Boolean)}}catch{}if(!picks.length)picks=rankSuggestions(text);box.innerHTML=picks.length?picks.map(m=>`<article class="suggestion"><b>${esc(m.e||'🍽️')} ${esc(m.n)}</b><p class="muted">${price(m.p)}</p><button class="btn" data-add="${esc(m.id)}">Add suggestion</button></article>`).join(''):'<p class="muted">No suggestions available right now.</p>'}
function billHtml(o){const pay=`upi://pay?pa=${encodeURIComponent(UPI)}&pn=${encodeURIComponent('Campus Bites')}&am=${Number(o.total).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Campus Bites order '+o.id)}`;return `<h3>Bill · Order #${esc(o.id)}</h3><table>${o.items.map(i=>`<tr><td>${esc(i.q)} × ${esc(i.n)}</td><td>${price(i.q*i.p)}</td></tr>`).join('')}<tr><td><b>Total due</b></td><td><b>${price(o.total)}</b></td></tr></table><div class="actions"><a class="btn" href="${pay}">Pay ${price(o.total)} with UPI</a><button class="btn secondary" id="printBill">Print bill</button></div>`}
async function checkout(){const name=$('#customerName').value.trim();if(!name){$('#customerName').focus();alert('Please enter your name.');return}const items=menu.filter(m=>cart[m.id]).map(m=>({id:m.id,q:cart[m.id]}));if(!items.length)return;let order;try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,items,source:'web'})});if(r.ok){const d=await r.json();order=d.order}}catch{}if(!order){const db=local();order={id:db.next++,name,items:items.map(x=>{const m=menu.find(y=>y.id===x.id);return{id:x.id,n:m.n,p:m.p,q:x.q}}),total:total(),paymentStatus:'Payment pending'};db.orders.unshift(order);saveLocal(db)}cart={};lastBill=order;render();$('#want').scrollIntoView({block:'start'})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='shopTab'){page='shop';render()}else if(b.id==='ordersTab'){page='orders';render()}else if(b.id==='suggest')await suggest();else if(b.id==='checkout')await checkout();else if(b.id==='printBill')window.print();else if(b.dataset.add){const m=menu.find(x=>x.id===b.dataset.add);if(m&&(stock[m.id]===undefined||(cart[m.id]||0)<stock[m.id])){cart[m.id]=(cart[m.id]||0)+1;render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='want')suggest()});
boot();
</script>
</body>
</html>
